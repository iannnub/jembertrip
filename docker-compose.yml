version: '3.8'
services:
  db:
    image: postgres:15-alpine
    container_name: jembertrip_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jembertrip_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jembertrip_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-jembertrip_prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - jembertrip_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jembertrip_admin} -d ${POSTGRES_DB:-jembertrip_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jembertrip_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-jembertrip_admin}:${POSTGRES_PASSWORD:-jembertrip_secure_pass_2026}@db:5432/${POSTGRES_DB:-jembertrip_prod}
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/db_jembertrip_v2:/app/db_jembertrip_v2
    ports:
      - "8000:8000"
    networks:
      - jembertrip_network
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jembertrip_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - jembertrip_network
volumes:
  postgres_data:
networks:
  jembertrip_network:
    driver: bridge
